<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>VocabBrush 智慧時事筆刷閱覽</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1B24">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<script type="module" src="firebase-service.js"></script>
<style>
  :root {
    --md-primary:#D0BCFF; --md-on-primary:#381E72; --md-primary-container:#4F378B; --md-on-primary-container:#EADDFF;
    --md-secondary:#CCC2DC; --md-secondary-container:#4A4458; --md-on-secondary-container:#E8DEF8;
    --md-tertiary-container:#633B48; --md-on-tertiary-container:#FFD8E4;
    --md-error:#F2B8B5; --md-error-container:#8C1D18; --md-on-error-container:#F9DEDC;
    --md-background:#1E1B24; --md-surface:#2D253D; --md-surface-container-high:#332B44; --md-surface-variant:#4A4458;
    --md-on-surface:#E6E1E5; --md-on-surface-variant:#CAC4D0; --md-outline:#938F99; --md-outline-variant:#49454F;
    --word-font-size:20px; --font-body:'Noto Sans TC','Roboto',sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--md-background); color:var(--md-on-surface); font-family:var(--font-body); overscroll-behavior:none; }
  body { display:flex; justify-content:center; }
  #app { width:100%; max-width:460px; height:100dvh; position:relative; display:flex; flex-direction:column; overflow:hidden; }
  .scroll { flex:1; overflow-y:auto; padding:16px; padding-bottom:90px; -webkit-overflow-scrolling:touch; }
  .card { background:var(--md-surface); border-radius:16px; padding:16px; }

  /* Bottom nav */
  .bottom-nav { position:absolute; left:0; right:0; bottom:0; background:var(--md-surface-container-high); display:flex; padding:8px 0 max(8px,env(safe-area-inset-bottom)); z-index:40; }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--md-on-surface-variant); font-family:var(--font-body); font-size:11px; font-weight:600; cursor:pointer; padding:4px; }
  .nav-item .ic { font-size:20px; }
  .nav-item.active { color:var(--md-primary); font-weight:800; }

  /* Loading screen */
  .loading-screen { position:absolute; inset:0; background:var(--md-background); display:flex; align-items:center; justify-content:center; padding:24px; z-index:200; }
  .loading-inner { display:flex; flex-direction:column; align-items:center; gap:24px; }
  .pulse-icon { width:96px; height:96px; border-radius:50%; background:rgba(79,55,139,0.7); display:flex; align-items:center; justify-content:center; font-size:40px; animation:pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  .brand-title{font-size:22px;font-weight:800;color:var(--md-primary);margin:0;text-align:center;}
  .brand-sub{font-size:11px;color:rgba(208,188,255,.6);font-weight:700;letter-spacing:1.5px;margin:4px 0 0;text-align:center;}
  .spinner{width:36px;height:36px;border:3px solid rgba(208,188,255,.2);border-top-color:var(--md-primary);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .quote-card{background:rgba(74,68,88,.35);border:1px solid rgba(73,69,79,.5);border-radius:20px;padding:20px;text-align:center;}
  .quote-text{font-size:13px;line-height:20px;white-space:pre-line;margin:0;}

  /* Onboarding */
  .goal-overlay,.spot-overlay{position:absolute;inset:0;z-index:150;}
  .goal-overlay{background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px;}
  .goal-card{width:100%;max-width:360px;background:var(--md-surface);border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .goal-icon{width:52px;height:52px;border-radius:50%;background:var(--md-primary-container);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .goal-title{font-size:18px;font-weight:800;color:var(--md-primary);text-align:center;margin:0;}
  .goal-desc{font-size:12px;color:var(--md-on-surface-variant);text-align:center;line-height:18px;margin:0;}
  .goal-chip-row{display:flex;gap:6px;width:100%;}
  .goal-chip{flex:1;padding:9px 0;border-radius:10px;border:none;background:var(--md-surface-variant);color:var(--md-on-surface-variant);font-family:var(--font-body);font-weight:700;font-size:11px;cursor:pointer;}
  .goal-chip.sel{background:var(--md-primary);color:var(--md-on-primary);}
  .goal-input{width:100%;background:transparent;border:1px solid var(--md-outline-variant);border-radius:8px;color:var(--md-on-surface);font-family:var(--font-body);font-size:13px;padding:10px;}
  .goal-submit{width:100%;height:46px;border:none;border-radius:14px;background:var(--md-primary);color:var(--md-on-primary);font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer;}

  .spot-hole{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.82);transition:all .5s cubic-bezier(.4,0,.2,1);}
  .spot-dialog{position:absolute;left:16px;right:16px;display:flex;flex-direction:column;gap:8px;transition:all .5s cubic-bezier(.4,0,.2,1);}
  .spot-card-top{background:var(--md-primary-container);border:1.5px solid rgba(208,188,255,.6);border-radius:18px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;}
  .step-pill{background:var(--md-primary);color:var(--md-on-primary);font-size:10px;font-weight:700;padding:3px 8px;border-radius:14px;}
  .step-title{color:var(--md-on-primary-container);font-weight:800;font-size:13px;}
  .spot-card-body{background:var(--md-surface);border-radius:20px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.4);}
  .spot-desc{font-size:12px;line-height:20px;margin:0 0 12px;}
  .spot-actions{display:flex;justify-content:space-between;align-items:center;}
  .skip-btn{background:none;border:none;color:var(--md-on-surface-variant);font-family:var(--font-body);font-size:12px;cursor:pointer;}
  .next-btn{background:var(--md-primary);color:var(--md-on-primary);border:none;border-radius:10px;padding:7px 16px;font-family:var(--font-body);font-weight:700;font-size:12px;cursor:pointer;}

  /* Shared bits reused across screens */
  .section-title{font-size:15px;font-weight:800;color:var(--md-primary);margin:0;}
  .txt-field{width:100%;background:transparent;border:1px solid var(--md-outline);border-radius:6px;color:var(--md-on-surface);font-family:var(--font-body);font-size:13px;padding:10px 12px;}
  textarea.txt-field{height:80px;resize:none;}
  .btn-primary{background:var(--md-primary);color:var(--md-on-primary);border:none;border-radius:10px;font-family:var(--font-body);font-weight:700;cursor:pointer;}

  /* ArticleHub bits */
  .greet-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .greet-title{font-size:20px;font-weight:800;margin:0;}
  .avatar-badge{width:40px;height:40px;border-radius:20px;background:linear-gradient(135deg,#F43F5E,#F59E0B);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
  .review-banner{background:var(--md-primary);border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:16px;}
  .review-title{color:#fff;font-weight:800;font-size:14px;margin:0;}
  .review-sub{color:rgba(255,255,255,.85);font-size:11px;margin:2px 0 0;}
  .subtabs{display:flex;background:rgba(74,68,88,.45);border-radius:24px;padding:4px;margin:16px 0;}
  .subtab{flex:1;text-align:center;padding:9px 0;border-radius:20px;font-size:10px;font-weight:700;color:var(--md-on-surface-variant);cursor:pointer;}
  .subtab.active{background:var(--md-primary);color:var(--md-on-primary);}
  .news-card,.assignment-card{background:rgba(74,68,88,.4);border:1px solid rgba(147,143,153,.15);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:8px;}
  .news-title{font-size:13px;font-weight:700;color:var(--md-primary);}
  .news-desc{font-size:11px;color:var(--md-on-surface-variant);margin-top:4px;}
  .cat-row{display:flex;gap:6px;margin-bottom:10px;}
  .cat-chip{flex:1;height:30px;border-radius:20px;border:1px solid var(--md-outline);background:var(--md-surface);color:var(--md-on-surface-variant);font-family:var(--font-body);font-size:10px;font-weight:700;cursor:pointer;}
  .cat-chip.active{background:var(--md-primary-container);color:var(--md-on-primary-container);border-color:var(--md-primary);}

  /* VocabBook bits */
  .chip-row{display:flex;gap:8px;margin:10px 0;}
  .chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--md-outline);color:var(--md-on-surface-variant);background:transparent;cursor:pointer;font-family:var(--font-body);}
  .chip.selected{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-color:transparent;}
  .word-card{border-radius:12px;padding:10px 14px;cursor:pointer;background:rgba(74,68,88,.4);margin-top:8px;}
  .word-card.mastered{background:rgba(204,194,220,.12);border:1px solid rgba(208,188,255,.25);}
  .word-top{display:flex;justify-content:space-between;align-items:center;}
  .word-text{font-size:15px;font-weight:700;color:var(--md-primary);}

  /* Profile bits */
  .avatar{width:72px;height:72px;border-radius:50%;background:#4285F4;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;margin:0 auto 8px;}
  .metric{flex:1;border-radius:14px;padding:12px;}
  .metric-label{font-size:10px;font-weight:700;margin:0 0 4px;}
  .metric-value{font-size:18px;font-weight:800;margin:0;}

  /* Reader */
  #readerScreen{position:absolute;inset:0;background:var(--md-background);display:none;flex-direction:column;padding:2px;z-index:30;}
  .top-bar{display:flex;align-items:center;gap:8px;padding:6px 4px;}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(74,68,88,.4);color:var(--md-primary);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;}
  .doc-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .doc-sub{font-size:10px;color:var(--md-primary);font-weight:600;}
  .mode-toggle-btn{border:none;border-radius:10px;padding:7px 12px;font-family:var(--font-body);font-weight:700;font-size:12px;cursor:pointer;background:var(--md-primary);color:var(--md-on-primary);}
  .page-card{flex:1;background:#FCFAF2;border-radius:16px;padding:12px;margin:4px 2px;display:flex;flex-direction:column;overflow:hidden;}
  .word-flow{display:flex;flex-wrap:wrap;align-content:flex-start;flex:1;overflow-y:auto;}
  .word-box{padding:3px 4px;border-radius:6px;cursor:pointer;}
  .word-box.target{background:#FEF3C7;border:1px solid #F59E0B;}
  .word-box .txt{font-size:var(--word-font-size);line-height:calc(var(--word-font-size) * 1.6);color:#261D15;font-weight:500;}
  .word-box.target .txt{color:#92400E;font-weight:700;}

  /* Translation sheet (global) */
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;transition:.25s;z-index:90;display:flex;align-items:flex-end;justify-content:center;}
  .sheet-overlay.show{background:rgba(0,0,0,.5);pointer-events:auto;}
  .sheet-card{width:100%;max-width:460px;background:#332B44;border-radius:24px 24px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
  .sheet-overlay.show .sheet-card{transform:translateY(0);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;}
  .sheet-brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--md-on-surface-variant);}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:#00E676;}
  .sheet-close{background:none;border:none;color:var(--md-on-surface-variant);font-size:16px;cursor:pointer;}
  .sheet-word{font-size:24px;font-weight:700;color:var(--md-primary);}
  .sheet-translation{font-size:17px;font-weight:700;color:#CCC2DC;}
  .sheet-def{font-size:13px;line-height:20px;margin-top:8px;}
  .saved-strip{display:flex;align-items:center;gap:8px;margin-top:10px;background:rgba(74,68,88,.4);border-radius:8px;padding:9px;font-size:11px;font-weight:700;}

  /* Review session overlay */
  #reviewOverlay{position:absolute;inset:0;background:linear-gradient(180deg,#342C46 0%,var(--md-background) 60%);display:none;flex-direction:column;align-items:center;padding:16px;z-index:120;}
  .flip-scene{width:88%;aspect-ratio:1.2;perspective:1200px;margin:8px auto;cursor:pointer;}
  .flip-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.4);}
  .flip-card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
  .face-front{background:linear-gradient(180deg,var(--md-primary-container),var(--md-surface));color:var(--md-on-primary-container);}
  .face-back{background:linear-gradient(180deg,var(--md-secondary-container),var(--md-surface-variant));transform:rotateY(180deg);}
  .card-word{font-size:28px;font-weight:800;}
  .action-row{width:88%;display:flex;gap:14px;margin-top:24px;}
  .action-btn{flex:1;height:44px;border:none;border-radius:12px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;}
  .btn-practice{background:var(--md-error-container);color:var(--md-on-error-container);}
  .btn-mastered{background:#2E7D32;color:#fff;}
  .option{display:flex;align-items:center;gap:10px;background:var(--md-surface);border:1.5px solid var(--md-outline-variant);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .option.correct{background:#1E3A22;border-color:#2E7D32;}
  .option.wrong{background:#3A1E1E;border-color:#C62828;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--md-surface);color:var(--md-on-surface);border:1px solid var(--md-primary);border-radius:12px;padding:10px 16px;font-size:12px;font-weight:700;max-width:80%;text-align:center;transition:.25s;pointer-events:none;z-index:250;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .demo-banner{position:absolute;top:0;left:0;right:0;background:#4A3A1E;color:#FFD966;font-size:11px;font-weight:700;text-align:center;padding:6px 8px;z-index:300;}
  .auth-tab-row{display:flex;background:rgba(255,255,255,.06);border-radius:8px;padding:4px;margin-bottom:12px;}
  .auth-tab{flex:1;text-align:center;padding:8px 0;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--md-on-surface-variant);}
  .auth-tab.sel{background:var(--md-primary);color:var(--md-on-primary);}
</style>
</head>
<body>
<div id="app">
  <div class="demo-banner" id="demoBanner" style="display:none;">⚠️ 示範模式：尚未連接 Firebase，資料不會被保存</div>
  <div class="scroll" id="mainScroll"></div>
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-item active" onclick="setTab(0)"><span class="ic">🏠</span>筆刷閱讀器</button>
    <button class="nav-item" onclick="setTab(1)"><span class="ic">⭐</span>智慧生字庫</button>
    <button class="nav-item" onclick="setTab(2)"><span class="ic">👤</span>個人中心</button>
  </div>

  <div id="readerScreen"></div>
  <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()"><div class="sheet-card"><div class="sheet-head"><div class="sheet-brand"><span class="brand-dot"></span>Gemini AI 雙語字典室</div><button class="sheet-close" onclick="closeSheet()">✕</button></div><div id="sheetBody"></div></div></div>
  <div id="reviewOverlay"></div>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-inner">
      <div class="pulse-icon">🖌️</div>
      <div><p class="brand-title">智慧時事筆刷閱覽</p><p class="brand-sub">SMART BRUSH READER</p></div>
      <div class="spinner"></div>
      <div class="quote-card"><p class="quote-text" id="quoteText"></p></div>
    </div>
  </div>

  <div class="goal-overlay" id="goalOverlay" style="display:none;">
    <div class="goal-card">
      <div class="goal-icon">🎯</div>
      <p class="goal-title">設定您的每日閱讀目標</p>
      <p class="goal-desc">歡迎使用智慧筆刷學英文！請先設定您每天預計閱讀英文的時間 (分鐘)：</p>
      <div class="goal-chip-row" id="goalChips"></div>
      <input class="goal-input" id="goalCustomInput" value="15">
      <button class="goal-submit" onclick="finishGoalStep()">儲存目標並開始體驗 🚀</button>
    </div>
  </div>

  <div class="spot-overlay" id="spotOverlay" style="display:none;">
    <div class="spot-hole" id="spotHole"></div>
    <div class="spot-dialog" id="spotDialog">
      <div class="spot-card-top"><span class="step-pill" id="stepPill"></span><span class="step-title" id="stepTitle"></span></div>
      <div class="spot-card-body"><p class="spot-desc" id="stepDesc"></p>
        <div class="spot-actions"><button class="skip-btn" onclick="skipTour()">跳過導覽</button><button class="next-btn" id="nextStepBtn" onclick="nextStep()"></button></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===================== Global App State =====================
const S = {
  currentTab: 0,
  isReadingModeActive: false,
  isReviewModeActive: false,
  currentUser: { name:"單字美學家", email:"vocab.brush.innovator@gmail.com" },
  vocabList: [
    { word:"resilient", status:1, reviewCount:5, sourceArticle:"經濟學人：全球供應鏈", definition:"adj. 有韌性的，能快速恢復的" },
    { word:"scrutiny", status:0, reviewCount:1, sourceArticle:"經濟學人：全球供應鏈", definition:"n. 仔細審查，監督" },
    { word:"pragmatic", status:0, reviewCount:3, sourceArticle:"", definition:"adj. 務實的" },
  ],
  readHistory: [{ title:"經濟學人：全球供應鏈重塑", content:"Global supply chains have proven remarkably resilient..." }],
  activeSubTab: 0,
  selectedCategory: 'technology',
  filterState: 0,
  documentTitle: "", documentText: "", currentPage: 0, isBrushMode: true, fontSize: 20,
  studentClassId: null,
  onboardingStep: null, // null = not showing; 0..4
};

const mockDictionary = {
  resilient:{phonetic:"rɪˈzɪliənt",partOfSpeech:"adj.",translation:"有韌性的",definition:"能從困境中快速恢復的特質。"},
  scrutiny:{phonetic:"ˈskruːtəni",partOfSpeech:"n.",translation:"仔細審查",definition:""},
  pragmatic:{phonetic:"præɡˈmætɪk",partOfSpeech:"adj.",translation:"務實的",definition:"以實際效果與可行性為優先考量。"},
  ambiguous:{phonetic:"æmˈbɪɡjuəs",partOfSpeech:"adj.",translation:"模稜兩可的",definition:"可作多種解釋、意思不明確。"}
};

// ===================== Boot sequence =====================
const quotes = ["「用智慧的筆刷，在國際時事中遇見更好的自己。」\n\n讓英語學習融入生活，開啟新的一天 📖","「每一天，都是拓展視野與詞彙的全新旅程。」\n\n浸淫在真實時事語境，單字便有了靈魂 ✨"];
document.getElementById('quoteText').textContent = quotes[Math.floor(Math.random()*quotes.length)];

window.addEventListener('firebase-ready', bootApp);
// 保險：若 firebase-service.js 載入失敗（例如離線開發），2.5 秒後強制以示範模式啟動
setTimeout(() => { if (!window.__booted) bootApp(); }, 2500);

function bootApp(){
  if (window.__booted) return;
  window.__booted = true;

  const configured = window.FB && window.FB.configured;
  document.getElementById('demoBanner').style.display = configured ? 'none' : 'block';

  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';

    if (!configured) {
      // 示範模式：直接用假資料進主畫面
      const isFirstTime = true;
      if (isFirstTime) { S.onboardingStep = 0; showGoalOverlay(); } else { renderMain(); }
      return;
    }

    // 已連接 Firebase：監聽真實登入狀態
    window.FB.onAuthChange(async (user) => {
      if (!user) { renderAuthGate(); return; }
      const profile = await window.FB.getUserProfile(user.uid);
      S.currentUser = profile || { name: user.email.split('@')[0], email: user.email };
      S.currentUser.uid = user.uid;
      window.FB.listenVocabWords(user.uid, (list) => { S.vocabList = list; if (S.currentTab===1) renderVocabList(); });
      window.FB.listenReadHistory(user.uid, (list) => { S.readHistory = list; if (S.currentTab===0) renderMain(); });

  const dr = app.getBoundingClientRect();

    const r = target.getBoundingClientRect(), pad = 6;
    hole.style.left=(r.left-dr.left-pad)+'px'; hole.style.top=(r.top-dr.top-pad)+'px';

function openTranslationSheet(rawWord){
  const overlay=document.getElementById('sheetOverlay'), body=document.getElementById('sheetBody');
  overlay.classList.add('show');
  body.innerHTML = `<div style="text-align:center;padding:20px 0;"><div class="spinner" style="margin:0 auto 10px;"></div><p style="color:var(--md-primary);font-size:13px;">正在連線 AI 加速解碼釋意中...</p></div>`;

  const lookup = async () => {
    const key = rawWord.toLowerCase();
    let d = mockDictionary[key]; // 示範模式 fallback
    if (window.FB && window.FB.configured) {
      try {
        d = await window.FB.translateWordCloud(key); // 內部會先查快取，沒有才呼叫 Gemini（走 Cloud Function 代理，金鑰不外洩）
      } catch (e) {
        console.error(e);
        body.innerHTML = `<div style="text-align:center;padding:12px 0;"><b style="color:#F2B8B5;">翻譯或金鑰認證失敗</b><p style="font-size:12px;color:var(--md-on-surface-variant);margin-top:6px;">${e.message || '請確認 Cloud Functions 已部署'}</p></div>`;
        return;
      }
    }
    if (!d){ body.innerHTML=`<div style="text-align:center;padding:12px 0;"><b style="color:#F2B8B5;">翻譯或金鑰認證失敗</b><p style="font-size:12px;color:var(--md-on-surface-variant);margin-top:6px;">示範字典僅收錄 resilient/scrutiny/pragmatic/ambiguous</p></div>`; return; }

    if (!S.vocabList.find(w=>w.word===key)) {
      const newWord = {word:key,status:0,reviewCount:0,sourceArticle:S.documentTitle,definition:`${d.partOfSpeech} ${d.translation}`};
      if (window.FB && window.FB.configured && S.currentUser.uid) window.FB.addVocabWord(S.currentUser.uid, newWord);
      else S.vocabList.push(newWord);
    }
    body.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-top:8px;"><span class="sheet-word">${key}</span><span style="color:var(--md-on-surface-variant);">[${d.phonetic}]</span></div>
      <div style="margin-top:6px;"><span class="sheet-translation">${d.translation}</span></div>
      ${d.definition?`<div class="sheet-def">${d.definition}</div>`:`<div class="card" style="margin-top:8px;text-align:center;"><b style="color:var(--md-primary);font-size:12px;">🔒 付費解鎖：詳細釋意與例句</b></div>`}
      <div class="saved-strip">✅ 此單字已自動記錄至您的生字庫後台 📝</div>`;
  };
  setTimeout(lookup, 800);
}

// ===================== ReviewSession overlay =====================
function openReview(){
  if (S.vocabList.length===0){ showToast('目前尚無生字可複習'); return; }
  document.getElementById('reviewOverlay').style.display='flex';
  Rv.words = S.vocabList.slice(0,3); Rv.mode='FLASHCARD'; Rv.idx=0; Rv.flipped=false; Rv.mastered=0; Rv.score=0; Rv.selected=null; Rv.answered=false;
  buildQuiz(); renderReview();
}
function closeReview(){ document.getElementById('reviewOverlay').style.display='none'; }
const Rv = {};
function buildQuiz(){
  const pool = Rv.words.map(w=>w.definition);
  Rv.quiz = Rv.words.map(w=>{ const d=[...pool.filter(t=>t!==w.definition)].slice(0,3); while(d.length<3) d.push('干擾選項'); const opts=[w.definition,...d].sort(()=>Math.random()-.5); return {word:w,options:opts,correctIndex:opts.indexOf(w.definition)}; });
}
function renderReview(){
  const c = document.getElementById('reviewOverlay');
  if (Rv.mode==='FLASHCARD'){
    const w = Rv.words[Rv.idx];
    c.innerHTML = `<div style="width:100%;display:flex;justify-content:flex-end;"><button class="icon-btn" onclick="closeReview()">✕</button></div>
      <p style="font-size:12px;font-weight:700;color:var(--md-primary);">生字記憶卡片 • ${Rv.idx+1} / ${Rv.words.length}</p>
      <div class="flip-scene" onclick="Rv.flipped=!Rv.flipped;renderReview();"><div class="flip-card ${Rv.flipped?'flipped':''}">
        <div class="face face-front"><div class="card-word">${w.word}</div></div>
        <div class="face face-back"><div style="font-size:22px;font-weight:700;color:var(--md-primary);">${w.definition}</div></div>
      </div></div>
      <div class="action-row"><button class="action-btn btn-practice" onclick="nextFlash(false)">✕ 需要再練習</button><button class="action-btn btn-mastered" onclick="nextFlash(true)">✓ 我已記住</button></div>`;
  } else if (Rv.mode==='QUIZ'){
    const q = Rv.quiz[Rv.idx];
    c.innerHTML = `<div style="width:100%;display:flex;justify-content:flex-end;"><button class="icon-btn" onclick="closeReview()">✕</button></div>
      <p style="font-size:12px;font-weight:700;color:var(--md-primary);">複習測驗挑戰 • ${Rv.idx+1} / ${Rv.words.length}</p>
      <div class="card" style="width:90%;text-align:center;margin-bottom:12px;"><b style="font-size:18px;">「${q.word.word}」的意思是？</b></div>
      <div style="width:90%;" id="optArea"></div>
      <button class="next-btn" style="width:90%;margin-top:10px;height:44px;" ${Rv.answered?'':'disabled'} onclick="nextQuiz()">${Rv.idx<Rv.words.length-1?'下一題':'看結算報告'}</button>`;
    const area = document.getElementById('optArea');
    q.options.forEach((opt,i)=>{ const cls = Rv.answered ? (i===q.correctIndex?'correct':(i===Rv.selected?'wrong':'')) : ''; const d=document.createElement('div'); d.className='option '+cls; d.textContent=opt; d.onclick=()=>selectOpt(i); area.appendChild(d); });
  } else {
    c.innerHTML = `<div style="text-align:center;width:100%;"><p style="font-size:40px;">✅</p><b style="font-size:18px;">🎉 太棒了！複習完成！</b>
      <div style="display:flex;gap:10px;margin:16px 0;"><div class="card" style="flex:1;"><div style="font-size:11px;">閃卡記住</div><b style="font-size:18px;color:#4CAF50;">${Rv.mastered}/${Rv.words.length}</b></div><div class="card" style="flex:1;"><div style="font-size:11px;">測驗答對</div><b style="font-size:18px;color:var(--md-primary);">${Rv.score}/${Rv.words.length}</b></div></div>
      <button class="next-btn" style="width:100%;height:44px;" onclick="closeReview()">完成複習並回到首頁</button></div>`;
  }
}
function nextFlash(m){ if(m) Rv.mastered++; Rv.flipped=false; if(Rv.idx<Rv.words.length-1) Rv.idx++; else { Rv.idx=0; Rv.mode='QUIZ'; } renderReview(); }
function selectOpt(i){ if(Rv.answered) return; Rv.selected=i; Rv.answered=true; if(i===Rv.quiz[Rv.idx].correctIndex) Rv.score++; renderReview(); }
function nextQuiz(){ Rv.selected=null; Rv.answered=false; if(Rv.idx<Rv.words.length-1) Rv.idx++; else Rv.mode='SUMMARY'; renderReview(); }

// ===================== Toast =====================
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

// ===================== Service worker registration =====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(()=>{}); });
}
</script>
</body>
</html>
